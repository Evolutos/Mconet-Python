name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  build:
    name: Build baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src
      - run: ruff format --check .
      - run: ruff check .
      - run: pyright
      - run: python scripts/check_import_boundaries.py
      - run: python scripts/check_api_compatibility.py
      - run: python scripts/check_package_names.py
      - run: python scripts/check_runtime_compatibility.py
      - run: python scripts/check_version_policy.py
      - run: python scripts/build_all.py

  unit:
    name: Unit / Python ${{ matrix.python-version }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/unit --cov=mconet --cov-report=term-missing

  contract:
    name: Contract
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/contract

  conformance:
    name: Conformance
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/conformance --junitxml=conformance-report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-report
          path: conformance-report.xml

  package:
    name: Package
    needs: conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/build_all.py
      - run: python scripts/verify_release_consumption.py
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: |
            dist/
            samples/text-unary/dist/
